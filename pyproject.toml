[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reliefos-disaster-response"
version = "0.1.0"
description = "Open-source, AI-assisted disaster reporting and rescue coordination on AWS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Chandrachood Raveendran" },
  { name = "ReliefOS contributors" }
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.10,<3",
  "strands-agents>=1.0,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.urls]
"Homepage" = "https://chandrachood.in"
"LinkedIn" = "https://www.linkedin.com/in/chandrachoodraveendran"
"Repository" = "https://github.com/chandrachood/ReliefOS.git"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]
"app/auth.py" = ["S105"]
"app/settings.py" = ["S105"]
"scripts/create_local_tables.py" = ["S106"]
"tests/*" = ["S101", "S106"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
